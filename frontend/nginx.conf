# nginx configuration for the RIP frontend.
#
# Serves the built SPA and proxies /api to the backend service so the browser
# sees a single origin (no CORS preflight, and cookies/headers stay simple).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API enforces its own body limit, but reject oversized uploads at the
    # edge too: the app's Content-Length check cannot see chunked requests.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The SPA is fully self-hosted (fonts, scripts, images),
    # CORS is avoided by proxying /api on the same origin, and API calls happen
    # over same-origin HTTP/SSE only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Hashed build assets are immutable; index.html must never be cached or
    # users keep booting a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Proxy API traffic to the backend service.
    #
    # The upstream goes through a variable deliberately. With a literal
    # `proxy_pass http://api:8000`, nginx resolves the name once while loading
    # the config and caches the address for the process lifetime, which has two
    # consequences: the container refuses to start at all when `api` cannot be
    # resolved yet ("host not found in upstream"), and when the API container is
    # recreated on a new IP the proxy keeps sending traffic to the old one until
    # nginx is restarted. Naming a resolver and using a variable defers lookup
    # to request time and re-resolves on the TTL below.
    #
    # 127.0.0.11 is Docker's embedded DNS server, present on every user-defined
    # network (which is what compose creates).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /api/ {
        set $upstream_api "http://api:8000";
        # $request_uri keeps the original path and query string intact; a
        # variable proxy_pass would otherwise re-normalise the URI.
        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events for /chat: disable buffering so frames are
        # forwarded as they are produced, and allow a long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
