name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_NO_CACHE_DIR: "1"
  # backend.enterprise.config refuses to import without a signing secret. This is
  # a throwaway CI value; real deployments source it from a secret manager.
  ENTERPRISE_JWT_SECRET_KEY: "ci-only-not-a-real-secret-0123456789abcdef0123456789abcdef"
  API_RATE_LIMIT_ENABLED: "false"

jobs:
  # ---------------------------------------------------------------------------
  # Linting & formatting — full codebase. Pre-existing complexity warnings
  # in specific modules are suppressed via pyproject.toml per-file-ignores.
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.5.7 black==24.8.0 mypy==1.11.2
      - name: Ruff
        # scripts/ is deployment-critical (env generation, host bootstrap) and
        # was previously unlinted, so real errors sat there unnoticed.
        run: ruff check backend/ scripts/
      - name: Black
        run: black --check backend/ scripts/
      - name: Config docs are in sync
        run: |
          pip install "pydantic[email]>=2.7.0,<3.0.0" "pydantic-settings>=2.3.0,<3.0.0"
          pip install "fastapi>=0.110.0,<1.0.0" "sqlalchemy>=2.0.0,<3.0.0"
          python scripts/generate_env_example.py --check

  # ---------------------------------------------------------------------------
  # Static type checking. Reported separately and non-blocking: the codebase is
  # not yet clean under the strict mypy profile, and gating every other job on
  # it (via `needs:`) previously blocked the whole pipeline.
  # ---------------------------------------------------------------------------
  backend-types:
    name: Backend type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type checker
        run: pip install mypy==1.11.2
      - name: MyPy
        run: mypy backend/

  # ---------------------------------------------------------------------------
  # Unit & integration tests. Heavy ML dependencies are installed from
  # requirements.txt; tests requiring external API keys are marked and skipped.
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest backend/tests/unit -m unit -q --cov=backend --cov-report=term-missing
      - name: Integration tests
        run: pytest backend/tests/integration -m integration -q
      - name: Enterprise tests
        run: pytest backend/tests/enterprise -m enterprise -q
      - name: Database migrations apply from scratch
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic upgrade head   # idempotent
          alembic downgrade base
      - name: Assert the suite is not silently empty
        run: |
          COLLECTED=$(pytest backend/tests -q --collect-only 2>/dev/null | tail -1)
          echo "collected: $COLLECTED"
          echo "$COLLECTED" | grep -qE "[0-9]+ tests? collected" \
            || { echo "::error::No tests were collected"; exit 1; }

  # ---------------------------------------------------------------------------
  # Frontend tests, lint and build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Security scanning. The audit is split by what actually ships:
  #   * requirements-runtime.txt is the API image's dependency set -> blocking.
  #   * requirements.txt adds dev/CI tooling (pytest, black, mypy, ...) that
  #     never reaches a deployed artifact -> reported, but not a release gate.
  # bandit runs without `|| true` so real code findings fail the build.
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auditor
        run: pip install pip-audit==2.8.0
      - name: Dependency audit - runtime image (blocking)
        # pip-audit already exits non-zero when it finds a vulnerability. There
        # is no --fail-on-vuln flag; passing one aborts with
        # "unrecognized arguments: --fail-on-vuln" before any auditing happens.
        run: pip-audit -r requirements-runtime.txt
      - name: Dependency audit - dev tooling (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: |
          pip install bandit==1.8.3
          bandit -r backend -x backend/tests -ll

  # ---------------------------------------------------------------------------
  # Build verification - produce a wheel/sdist.
  # ---------------------------------------------------------------------------
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # ---------------------------------------------------------------------------
  # Docker build verification.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: retrieval-intelligence-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: retrieval-intelligence-platform-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the API container
        run: |
          SMOKE_SECRET="ci-only-not-a-real-secret-0123456789abcdef0123456789"
          docker run -d --name rip-smoke -p 8000:8000 \
            -e ENTERPRISE_JWT_SECRET_KEY="$SMOKE_SECRET" \
            -e API_ENVIRONMENT=development \
            retrieval-intelligence-platform:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/live > /dev/null; then
              echo "container is live"; break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::container never became healthy"; docker logs rip-smoke; exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/health/ready
          docker rm -f rip-smoke
