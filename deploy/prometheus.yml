# Prometheus scrape configuration for the RIP API.
#
# /metrics requires a bearer token. Set API_METRICS_TOKEN on the api service to
# the same value written to deploy/metrics_token (mounted into this container),
# or remove the authorization block and set API_METRICS_REQUIRE_AUTH=false on a
# trusted private network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rip-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      # File is optional; scrapes fail with 401 until the token is provided.
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets:
          - api:8000
