# Retrieval Intelligence Platform - local and staging orchestration.
#
# Services:
#   frontend   - React SPA served by nginx, proxies /api to the API service
#   api        - FastAPI application (multi-stage image built from ./Dockerfile)
#   postgres   - metadata / conversation store
#   redis      - cache (reserved for shared rate limiting)
#   prometheus - scrapes the API /metrics endpoint
#
# Usage:
#   cp .env.example .env      # then set ENTERPRISE_JWT_SECRET_KEY
#   docker compose up --build
#
# Open http://localhost:3000

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: retrieval-intelligence-platform-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: retrieval-intelligence-platform:latest
    # The nginx frontend proxies /api over the compose network, so the API does
    # not need to be reachable from other hosts. Bind to 127.0.0.1 so the port
    # is not exposed to the LAN.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      API_ENVIRONMENT: ${API_ENVIRONMENT:-development}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_LOG_FORMAT: ${API_LOG_FORMAT:-json}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["http://localhost:3000"]}
      # Required in production: validate_for_environment refuses to boot on the
      # ["*"] default. Without this line the variable could be set in .env and
      # would still never reach the container, making a production compose
      # deploy impossible.
      API_TRUSTED_HOSTS: ${API_TRUSTED_HOSTS:-["*"]}
      # Only meaningful behind TLS termination; off by default for plain HTTP.
      API_HSTS_ENABLED: ${API_HSTS_ENABLED:-false}
      API_METRICS_REQUIRE_AUTH: ${API_METRICS_REQUIRE_AUTH:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      API_RATE_LIMIT_AUTH_PER_MINUTE: ${API_RATE_LIMIT_AUTH_PER_MINUTE:-10}
      API_PROMETHEUS_ENABLED: "true"
      # Requests arrive via the nginx frontend, so forwarded headers are
      # trustworthy from that hop only.
      API_TRUST_PROXY_HEADERS: ${API_TRUST_PROXY_HEADERS:-true}
      API_TRUSTED_PROXY_COUNT: ${API_TRUSTED_PROXY_COUNT:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # Token Prometheus presents when scraping /metrics.
      API_METRICS_TOKEN: ${API_METRICS_TOKEN:-}
      # Async driver is required; a sync URL is upgraded automatically.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rip:${POSTGRES_PASSWORD:-rip}@postgres:5432/rip}
      # Alembic owns the schema (applied by the entrypoint).
      DB_AUTO_CREATE: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # REQUIRED. Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      ENTERPRISE_JWT_SECRET_KEY: ${ENTERPRISE_JWT_SECRET_KEY:?set ENTERPRISE_JWT_SECRET_KEY in .env}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-fake}
      GENERATION_MODEL_NAME: ${GENERATION_MODEL_NAME:-fake-model}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      INTELLIGENT_RETRIEVAL_ENABLED: ${INTELLIGENT_RETRIEVAL_ENABLED:-false}
    volumes:
      # Without this the FAISS index is lost on every restart.
      - apidata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready').status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rip
      # Required (no default). A predictable database password is a trivial
      # credential for anyone who reaches the container or the network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rip
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rip"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # Mount the whole directory, not just prometheus.yml: the scrape config
      # reads its bearer token from /etc/prometheus/metrics_token, and a
      # single-file bind of a path that does not exist yet would have Docker
      # silently create a *directory* there. The official image keeps its
      # consoles under /usr/share/prometheus, so nothing is shadowed.
      - ./deploy:/etc/prometheus:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  apidata:
